<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>เข้าสู่ระบบ · Project sign-in</title><link rel="stylesheet" href="/__identity/sign-in.css"><script type="module" src="/__identity/eye.mjs"></script><script type="module" src="/__identity/sign-in.mjs"></script></head><body data-application="portal"><main><header><strong>SPP · Caltex Wastewater 2027</strong><button id="language" type="button">English</button></header><h1 data-th="เข้าสู่ระบบโครงการ" data-en="Project sign-in">เข้าสู่ระบบโครงการ</h1><p data-th="ใช้ชื่อผู้ใช้และรหัสผ่านที่คุณตั้งเอง ไม่จำเป็นต้องกรอกอีเมล" data-en="Use your username and a password you choose. Email is not required.">ใช้ชื่อผู้ใช้และรหัสผ่านที่คุณตั้งเอง ไม่จำเป็นต้องกรอกอีเมล</p><nav><button type="button" id="login-mode" data-th="เข้าสู่ระบบ" data-en="Sign in">เข้าสู่ระบบ</button><button type="button" id="setup-mode" data-th="ตั้งหรือตั้งใหม่รหัสผ่าน" data-en="Set or reset password">ตั้งหรือตั้งใหม่รหัสผ่าน</button></nav><form id="login" method="post"><label><span data-th="ชื่อผู้ใช้" data-en="Username">ชื่อผู้ใช้</span><input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="1" maxlength="40"></label><label><span data-th="รหัสผ่าน" data-en="Password">รหัสผ่าน</span><input type="password" name="password" autocomplete="current-password" required maxlength="128"></label><label id="code-row" hidden><span data-th="รหัส 6 หลักจากแอปยืนยันตัวตน (หรือรหัสกู้คืน)" data-en="6-digit code from your authenticator app (or a recovery code)">รหัส 6 หลักจากแอปยืนยันตัวตน (หรือรหัสกู้คืน)</span><input name="code" inputmode="numeric" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" maxlength="20" disabled></label><button type="submit" data-th="เข้าสู่ระบบ" data-en="Sign in">เข้าสู่ระบบ</button></form><form id="setup" method="post" hidden><label><span data-th="รหัสตั้งค่าครั้งเดียวจากเจ้าของโครงการ" data-en="One-time setup code from the owner">รหัสตั้งค่าครั้งเดียวจากเจ้าของโครงการ</span><input name="token" autocomplete="off" autocapitalize="none" spellcheck="false" required minlength="43" maxlength="43"></label><label><span data-th="รหัสผ่านใหม่ (15–128 ตัวอักษร)" data-en="New password (15–128 characters)">รหัสผ่านใหม่ (15–128 ตัวอักษร)</span><input type="password" name="password" autocomplete="new-password" required minlength="15" maxlength="128"></label><label><span data-th="ยืนยันรหัสผ่าน" data-en="Confirm password">ยืนยันรหัสผ่าน</span><input type="password" name="confirm" autocomplete="new-password" required minlength="15" maxlength="128"></label><button type="submit" data-th="บันทึกรหัสผ่าน" data-en="Set password">บันทึกรหัสผ่าน</button></form><p id="status" role="status" aria-live="polite"></p><p class="help" data-th="หากลืมรหัสผ่าน ให้ติดต่อเจ้าของโครงการเพื่อขอรหัสตั้งใหม่ รหัสหมดอายุใน 15 นาที ใช้ได้ครั้งเดียว และจะออกจากระบบทุกอุปกรณ์" data-en="Forgot your password? Contact the owner for a reset code. Codes expire in 15 minutes, work once, and reset signs out every device.">หากลืมรหัสผ่าน ให้ติดต่อเจ้าของโครงการเพื่อขอรหัสตั้งใหม่ รหัสหมดอายุใน 15 นาที ใช้ได้ครั้งเดียว และจะออกจากระบบทุกอุปกรณ์</p><button type="button" id="logout" data-th="ล้างการเข้าสู่ระบบบนอุปกรณ์นี้" data-en="Sign out on this device">ล้างการเข้าสู่ระบบบนอุปกรณ์นี้</button><p><a href="/privacy.html">ข้อมูลส่วนบุคคล / Privacy</a> · <a href="/owner-recovery/">กู้คืนบัญชีเจ้าของ / Owner recovery</a></p></main></body></html>
